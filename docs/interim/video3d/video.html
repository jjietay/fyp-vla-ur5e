<!doctype html>
<!--
  The D2 video as a silent toy-like 3D animation, 1920 x 1080.
  render.mjs calls seek(t) for each frame and screenshots it, so every
  animation is a function of t and never of wall-clock time.
  Open with ?play to preview in a browser, or ?t=95 to hold one frame.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2 Toy Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=block" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root { --bg: #f6e6e4; --ink: #4a3446; --ink2: #7a5f73; --accent: #d9577f; }
  html, body { margin: 0; background: var(--bg); overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); }
  #stage canvas { position: absolute; inset: 0; }
  .scene { position: absolute; left: 112px; top: 112px; width: 700px; font-family: Nunito, sans-serif; color: var(--ink); display: none; }
  .kicker { font-weight: 800; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 18px; }
  .title { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 66px; line-height: 1.05; margin-bottom: 40px; }
  .title.big { font-size: 92px; }
  .line { font-weight: 700; font-size: 31px; line-height: 1.32; margin-bottom: 22px; padding-left: 34px; position: relative; }
  .line::before { content: ""; position: absolute; left: 0; top: 13px; width: 16px; height: 16px; border-radius: 50%; background: var(--dot, #7bdff2); }
  .line.plain { padding-left: 0; }
  .line.plain::before { display: none; }
  .line b { font-weight: 800; }
  .line code { font-family: ui-monospace, monospace; font-size: 27px; background: #fff6f3; padding: 1px 8px; border-radius: 8px; }
  .trace { font-weight: 700; font-size: 30px; margin-bottom: 14px; display: flex; gap: 18px; align-items: baseline; }
  .trace .n { font-family: Fredoka, sans-serif; color: #fff; background: var(--dot, #7bdff2); border-radius: 12px; padding: 0 12px; font-size: 24px; min-width: 18px; text-align: center; }
  .trace .w { color: var(--ink2); font-weight: 600; }
  .stats { margin-top: 30px; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 40px; }
  .note { font-weight: 600; font-size: 22px; color: var(--ink2); margin-top: 10px; }
  .ref { position: absolute; left: 112px; bottom: 76px; font-family: Nunito, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: .08em;
         color: var(--ink); background: #fff6f3; border-radius: 22px; padding: 9px 20px; display: none; }
  .ref::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #fcbf49; margin-right: 12px; }
  #fade { position: absolute; inset: 0; background: var(--bg); pointer-events: none; }
</style>
</head>
<body>
<div id="stage"><div id="ui"></div><div id="fade"></div></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1920, H = 1080;
const C = { bg: 0xf6e6e4, pink: 0xff8fab, cyan: 0x7bdff2, mint: 0xb2f7ef, yellow: 0xfcbf49, cream: 0xfff6f3, ink: '#4a3446' };
const stage = document.getElementById('stage');

// ---------- small maths ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOutBack = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const lerpV = (a, b, u) => a.clone().lerp(b, u);
// mulberry32: every procedural layout comes from a fixed seed, so each render is the same.
function rng(seed) {
  return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// land(): an object dropped from height h at t0. It falls under gravity, squashes on
// contact, then makes two small settles. The settles are physical hops (d = 2*sqrt(2a/g)),
// so a heavy-looking object and a light one differ only in how far they fall.
const G = 40;
function land(t, t0, h) {
  const dt = t - t0;
  if (dt < 0) return { vis: false, y: h, sx: 1, sy: 1 };
  const fall = Math.sqrt(2 * h / G);
  if (dt < fall) { const sy = 1 + 0.07 * (dt / fall); return { vis: true, y: h - 0.5 * G * dt * dt, sx: 1 / Math.sqrt(sy), sy }; }
  const s = dt - fall;
  const a1 = Math.min(0.16, 0.05 * h + 0.02), a2 = a1 * 0.25;
  const d1 = 2 * Math.sqrt(2 * a1 / G), d2 = 2 * Math.sqrt(2 * a2 / G);
  let y = 0;
  if (s < d1) { const u = s / d1; y = 4 * a1 * u * (1 - u); }
  else if (s < d1 + d2) { const u = (s - d1) / d2; y = 4 * a2 * u * (1 - u); }
  const kick = (c, amp) => { const x = (s - c) / 0.035; return x < 0 ? 0 : amp * x * Math.exp(1 - x); };
  const sy = 1 - kick(0, 0.2) - kick(d1, 0.08) - kick(d1 + d2, 0.035);
  return { vis: true, y, sx: 1 / Math.sqrt(sy), sy };
}

// ---------- renderer, one key and one fill ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// No tone mapping: the background must stay exactly #f6e6e4, and the floor is a
// shadow-only material over it, so lights are kept low enough not to clip the pastels.
renderer.toneMapping = THREE.NoToneMapping;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.bg);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.32;

const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(-7, 12, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 });
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xfff0f4, 0.55);
fill.position.set(9, 4, 6);
scene.add(fill);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ color: 0x6b3550, opacity: 0.13 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const camera = new THREE.PerspectiveCamera(30, W / H, 0.5, 120);
// The text column sits on the left, so the frame is shifted and the 3D reads on the right.
camera.setViewOffset(W, H, -380, 0, W, H);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 12, aperture: 0.0009, maxblur: 0.0028 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());

// ---------- materials and shapes ----------
const matte = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0 });
const gloss = c => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.36, clearcoat: 0.55, clearcoatRoughness: 0.28, metalness: 0 });
function mesh(geo, mat, { cast = true } = {}) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; return m; }

const blobTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(90,40,64,0.75)'); r.addColorStop(0.45, 'rgba(90,40,64,0.32)'); r.addColorStop(1, 'rgba(90,40,64,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
function blob() {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.renderOrder = 1; return m;
}

// label(): text drawn on a canvas and put on a plane, for the faces of blocks.
function label(text, { w = 2, h = 0.6, size = 64, color = C.ink, weight = 600, font = 'Fredoka', align = 'center' } = {}) {
  const ppu = 256, c = document.createElement('canvas');
  c.width = Math.round(w * ppu); c.height = Math.round(h * ppu);
  const g = c.getContext('2d'); g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle';
  g.font = `${weight} ${size}px ${font}`;
  const lines = text.split('\n'), lh = size * 1.15, y0 = c.height / 2 - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => g.fillText(l, align === 'center' ? c.width / 2 : 12, y0 + i * lh));
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  return m;
}
// floorLabel(): a label lying flat on the floor, readable from the camera above.
function floorLabel(text, x, z, opts = {}) { const m = label(text, opts); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.01, z); return m; }

function block(w, h, d, color, text, { size = 60, glossy = false, r = 0.16 } = {}) {
  const g = new THREE.Group();
  const b = mesh(new RoundedBoxGeometry(w, h, d, 5, r), glossy ? gloss(color) : matte(color));
  b.position.y = h / 2; g.add(b);
  if (text) { const l = label(text, { w: w * 0.92, h: h * 0.86, size }); l.position.set(0, h / 2, d / 2 + 0.006); g.add(l); }
  return g;
}

function orange() {
  const g = new THREE.Group(), r = 0.42;
  const s = mesh(new THREE.SphereGeometry(r, 48, 32), gloss(C.yellow)); s.scale.y = 0.94; s.position.y = r * 0.94; g.add(s);
  const stem = mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.1, 10), matte(0x9b7b5a)); stem.position.y = r * 1.88 + 0.03; g.add(stem);
  const leaf = mesh(new THREE.SphereGeometry(0.13, 20, 12), matte(C.mint)); leaf.scale.set(1.3, 0.28, 0.6);
  leaf.position.set(0.12, r * 1.88 + 0.04, 0); leaf.rotation.z = -0.4; g.add(leaf);
  return g;
}
function bowl() {
  const pts = [[0, 0], [0.56, 0], [0.66, 0.06], [0.78, 0.5], [0.8, 0.56], [0.72, 0.56], [0.7, 0.5], [0.56, 0.12], [0, 0.12]].map(([x, y]) => new THREE.Vector2(x, y));
  const g = new THREE.Group();
  g.add(mesh(new THREE.LatheGeometry(pts, 64), gloss(C.pink)));
  return g;
}
function camProp(color = C.cyan) {
  const g = new THREE.Group();
  const body = mesh(new RoundedBoxGeometry(0.62, 0.36, 0.34, 4, 0.08), gloss(color)); body.position.y = 0.18; g.add(body);
  const lens = mesh(new THREE.CylinderGeometry(0.11, 0.12, 0.12, 24), matte(C.cream)); lens.rotation.x = Math.PI / 2; lens.position.set(0, 0.18, 0.2); g.add(lens);
  const glass = mesh(new THREE.CircleGeometry(0.075, 24), gloss(0x3b4a66)); glass.position.set(0, 0.18, 0.262); g.add(glass);
  return g;
}
function mic() {
  const g = new THREE.Group();
  const base = mesh(new THREE.CylinderGeometry(0.34, 0.4, 0.12, 32), matte(C.cream)); base.position.y = 0.06; g.add(base);
  const pole = mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.0, 12), matte(C.cyan)); pole.position.y = 0.6; g.add(pole);
  const head = mesh(new THREE.CapsuleGeometry(0.2, 0.25, 8, 24), gloss(C.pink)); head.position.y = 1.32; g.add(head);
  return g;
}
function glassBox(w, h, d) {
  const g = new THREE.Group();
  const geo = new RoundedBoxGeometry(w, h, d, 4, 0.12);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: C.cyan, transparent: true, opacity: 0.16, roughness: 0.2, depthWrite: false }));
  m.position.y = h / 2; g.add(m);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d)), new THREE.LineBasicMaterial({ color: 0x5bbfd6, transparent: true, opacity: 0.7 }));
  e.position.y = h / 2; g.add(e);
  return g;
}
function arrow(len, color = C.cream) {
  const g = new THREE.Group();
  const shaft = mesh(new RoundedBoxGeometry(len - 0.3, 0.1, 0.16, 3, 0.04), matte(color)); shaft.position.set(-0.15, 0.05, 0); g.add(shaft);
  const head = mesh(new THREE.ConeGeometry(0.2, 0.36, 3), matte(color)); head.rotation.z = -Math.PI / 2; head.rotation.x = Math.PI / 6;
  head.scale.y = 1; head.position.set(len / 2 - 0.18, 0.08, 0); g.add(head);
  return g;
}

// Prop: anything that lands. It owns a contact shadow that grows and fades with height.
class Prop {
  constructor(parent, obj, { x = 0, z = 0, floorY = 0, r = 0.5, t0 = 0, h = 3, yaw = 0 } = {}) {
    this.g = new THREE.Group(); this.g.add(obj); this.g.rotation.y = yaw; parent.add(this.g);
    this.blob = blob(); parent.add(this.blob);
    Object.assign(this, { x, z, floorY, r, t0, h, y: 0, scale: 1 });
  }
  update(t) {
    const L = land(t, this.t0, this.h);
    this.g.visible = this.blob.visible = L.vis && this.scale > 0.001;
    this.y = this.floorY + L.y;
    this.g.position.set(this.x, this.y, this.z);
    this.g.scale.set(L.sx * this.scale, L.sy * this.scale, L.sx * this.scale);
    const f = clamp(L.y / 3);
    const s = this.r * 2.6 * (1 + 0.7 * f) * this.scale;
    this.blob.position.set(this.x, this.floorY + 0.004, this.z);
    this.blob.scale.set(s, s, 1);
    this.blob.material.opacity = 0.5 * (1 - 0.7 * f);
  }
}
// pop(): for things that appear without falling (rings, envelopes): a quick scale-in with overshoot.
const pop = (t, t0, d = 0.45) => (t < t0 ? 0 : t > t0 + d ? 1 : easeOutBack(prog(t, t0, t0 + d)));

// ---------- the toy arm ----------
// Planar two-link IK in the vertical plane that the base yaw points along. The wrist
// keeps the gripper pointing straight down, as the real skills do.
const ARM = { H0: 1.25, L1: 1.6, L2: 1.45, GRIP: 0.78 };
function makeArm() {
  const root = new THREE.Group();
  const base = mesh(new THREE.CylinderGeometry(0.55, 0.66, 0.3, 40), matte(C.cream)); base.position.y = 0.15; root.add(base);
  const yaw = new THREE.Group(); root.add(yaw);
  const col = mesh(new THREE.CylinderGeometry(0.3, 0.32, ARM.H0 - 0.3, 32), gloss(C.mint)); col.position.y = 0.3 + (ARM.H0 - 0.3) / 2; yaw.add(col);
  const joint = (r, len) => { const j = mesh(new THREE.CylinderGeometry(r, r, len, 32), gloss(C.cyan)); j.rotation.x = Math.PI / 2; return j; };
  const sh = new THREE.Group(); sh.position.y = ARM.H0; yaw.add(sh); sh.add(joint(0.36, 0.72));
  const up = mesh(new THREE.CapsuleGeometry(0.21, ARM.L1, 8, 24), gloss(C.mint)); up.position.y = ARM.L1 / 2; sh.add(up);
  const el = new THREE.Group(); el.position.y = ARM.L1; sh.add(el); el.add(joint(0.3, 0.6));
  const fo = mesh(new THREE.CapsuleGeometry(0.18, ARM.L2, 8, 24), gloss(C.mint)); fo.position.y = ARM.L2 / 2; el.add(fo);
  const wr = new THREE.Group(); wr.position.y = ARM.L2; el.add(wr); wr.add(joint(0.22, 0.44));
  const wl = mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.3, 24), gloss(C.cyan)); wl.position.y = 0.2; wr.add(wl);
  const palm = mesh(new RoundedBoxGeometry(0.34, 0.22, 0.56, 4, 0.07), gloss(C.pink)); palm.position.y = 0.44; wr.add(palm);
  const fingers = [-1, 1].map(s => { const f = mesh(new RoundedBoxGeometry(0.14, 0.3, 0.1, 3, 0.04), gloss(C.pink)); f.position.y = 0.66; wr.add(f); return [f, s]; });
  const tip = new THREE.Object3D(); tip.position.y = ARM.GRIP; wr.add(tip);
  return {
    root, tip,
    // set(): tip in the arm's own frame (x forward from the base, y up), grip 0 closed .. 1 open.
    set(p, grip = 1) {
      const sz = ARM.H0;
      yaw.rotation.y = Math.atan2(-p.z, p.x);
      const d = Math.hypot(p.x, p.z), hgt = p.y + ARM.GRIP - sz;
      const D = clamp(Math.hypot(d, hgt), 0.4, ARM.L1 + ARM.L2 - 1e-3);
      const b = Math.acos(clamp((D * D - ARM.L1 ** 2 - ARM.L2 ** 2) / (2 * ARM.L1 * ARM.L2), -1, 1));
      const a = Math.atan2(d, hgt) - Math.atan2(ARM.L2 * Math.sin(b), ARM.L1 + ARM.L2 * Math.cos(b));
      sh.rotation.z = -a; el.rotation.z = -b; wr.rotation.z = -(Math.PI - a - b);
      for (const [f, s] of fingers) f.position.z = s * (0.07 + 0.15 * grip);
    },
    tipWorld() { root.updateMatrixWorld(true); return tip.getWorldPosition(new THREE.Vector3()); },
  };
}
// path(): piecewise eased motion through [t, value] keys.
function path(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1] = keys[i], [t0, v0] = keys[i - 1];
    if (t <= t1) { const u = ease(prog(t, t0, t1)); return typeof v0 === 'number' ? v0 + (v1 - v0) * u : lerpV(v0, v1, u); }
  }
  return keys[keys.length - 1][1];
}

// ---------- scenes ----------
// Each scene: a time span, a group, a camera dolly, a hero for the focus, and its text.
const SCENES = [];
function addScene(dur, html, ref, build) {
  const t0 = SCENES.length ? SCENES[SCENES.length - 1].t1 : 0;
  const group = new THREE.Group(); group.visible = false; scene.add(group);
  const el = document.createElement('div'); el.className = 'scene'; el.innerHTML = html;
  document.getElementById('ui').appendChild(el);
  const refEl = document.createElement('div'); refEl.className = 'ref'; refEl.textContent = ref || '';
  document.getElementById('ui').appendChild(refEl);
  const s = { t0, t1: t0 + dur, group, el, refEl, ...build(group) };
  SCENES.push(s);
}
const L = (t, html, dot = '#7bdff2', cls = '') => `<div class="line ${cls}" data-t="${t}" style="--dot:${dot}">${html}</div>`;

function build() {
  // 1. Title
  addScene(10, `
    <div class="kicker" data-t="0.3">NTU EEE · FYP A1005-261 · Interim</div>
    <div class="title big" data-t="0.5">Modular vs<br>end-to-end</div>
    ${L(1.6, 'Two ways to make a UR5e robot arm follow a spoken command.', '#ff8fab', 'plain')}
    ${L(2.6, 'Tay Juen Jie<br><span style="color:#7a5f73;font-weight:600">Supervisor: A/P Cheah Chien Chern</span>', '#ff8fab', 'plain')}`,
    '', g => {
      const arm = makeArm(); arm.root.position.set(0.2, 0, -0.6); g.add(arm.root);
      const armBlob = blob(); armBlob.position.set(0.2, 0.004, -0.6); armBlob.scale.set(2.4, 2.4, 1); armBlob.material.opacity = 0.45; g.add(armBlob);
      const o = new Prop(g, orange(), { x: 2.3, z: 1.0, r: 0.45, t0: 1.0, h: 3.2 });
      const b = new Prop(g, bowl(), { x: -1.9, z: 1.1, r: 0.8, t0: 1.5, h: 2.8 });
      return {
        cam: [[0, V(1.0, 3.6, 11.5), V(0.2, 1.1, 0.2)], [10, V(1.9, 3.3, 10.2), V(0.4, 1.0, 0.3)]],
        hero: () => o.g.position.clone().add(V(0, 0.4, 0)),
        update(t) {
          o.update(t); b.update(t);
          arm.set(V(1.3 + 0.25 * Math.sin(t * 0.9), 2.0 + 0.15 * Math.sin(t * 1.3), 0.9 + 0.3 * Math.sin(t * 0.7)), 0.7 + 0.3 * Math.sin(t * 1.6));
        },
      };
    });

  // 2. The question
  addScene(20, `
    <div class="kicker" data-t="0.2">The question</div>
    <div class="title" data-t="0.3">Two ways to follow one spoken command</div>
    ${L(1.2, '<b>A · modular:</b> an LLM plans over pretrained perception and scripted skills. Nothing is trained.', '#7bdff2')}
    ${L(6.2, '<b>B · end-to-end:</b> one model, trained on demonstrations, maps images and words to motion.', '#ff8fab')}
    ${L(11, 'Shan and Cheah argue that modular is more flexible. They tested no end-to-end model.', '#fcbf49')}
    ${L(15, 'This project tests that claim on real hardware.', '#b2f7ef')}`,
    'Interim report §1', g => {
      const zA = -1.0, zB = 1.6;
      const badge = (txt, col) => { const gg = new THREE.Group(); const p = mesh(new THREE.CylinderGeometry(0.5, 0.52, 0.5, 40), gloss(col)); p.position.y = 0.25; gg.add(p);
        const l = label(txt, { w: 0.8, h: 0.8, size: 150 }); l.rotation.x = -Math.PI / 2; l.position.y = 0.505; gg.add(l); return gg; };

    <div class="kicker" data-t="0.2">Next</div>
    <div class="title" data-t="0.3">What is done, and what comes next</div>
    ${L(0.8, '<b>Done:</b> calibration, the evaluation harness, and the first pick and place by A.', '#b2f7ef')}
    ${L(2.6, '<b>Dec:</b> pour and drawer skills, then A is frozen. <b>Jan:</b> demonstrations, then B is trained. <b>Feb:</b> scored trials of both.', '#fcbf49')}
    ${L(6.8, 'The interim report gives the full breakdown: the method, the calibration, the trace, and the plan for B.', '#ff8fab')}
    <div class="title" data-t="11.2" style="margin-top:34px;font-size:56px">Thank you.</div>`,
    'Interim report §7', g => {
      const steps = [['Dec 2026\npour · drawer\nfreeze A', C.cyan], ['Jan 2027\ndemos\ntrain B', C.mint], ['Feb 2027\nscored trials\nA and B', C.yellow]];
      const plinths = steps.map(([txt, col], i) => new Prop(g, block(2.0, 0.75 + 0.3 * i, 1.0, col, txt, { size: 46 }), { x: -1.2 + 2.2 * i, z: -0.4, r: 1.0, t0: 2.6 + 0.4 * i, h: 3.2 }));
      const track = mesh(new RoundedBoxGeometry(7.2, 0.06, 0.3, 3, 0.03), matte(C.cream)); track.position.set(1.0, 0.03, 0.55); g.add(track);
      const book = new THREE.Group();
      const pages = mesh(new RoundedBoxGeometry(1.9, 0.3, 2.5, 4, 0.06), matte(C.cream)); pages.position.y = 0.2; book.add(pages);
      const cover = mesh(new RoundedBoxGeometry(2.0, 0.08, 2.6, 4, 0.04), gloss(C.pink)); cover.position.y = 0.39; book.add(cover);
      const back = mesh(new RoundedBoxGeometry(2.0, 0.08, 2.6, 4, 0.04), gloss(C.pink)); back.position.y = 0.04; book.add(back);
      const t1 = label('Interim\nReport', { w: 1.7, h: 1.0, size: 110 }); t1.rotation.x = -Math.PI / 2; t1.position.set(0, 0.436, -0.35); book.add(t1);
      const t2 = label('FYP A1005-261', { w: 1.7, h: 0.3, size: 52, weight: 500 }); t2.rotation.x = -Math.PI / 2; t2.position.set(0, 0.436, 0.55); book.add(t2);
      const rep = new Prop(g, book, { x: 1.3, z: 2.4, r: 1.2, t0: 6.6, h: 3.6, yaw: -0.12 });
      return {
        cam: [[0, V(1.2, 6.4, 12.0), V(1.6, 0.6, 0.4)], [7, V(1.3, 6.4, 11.6), V(1.6, 0.6, 0.8)], [16, V(1.8, 7.0, 10.2), V(1.5, 0.3, 1.6)]], zoom: 1.2,
        hero: t => lerpV(V(1.0, 0.8, -0.4), V(1.3, 0.4, 2.4), ease(prog(t, 6.4, 7.6))),
        update(t) { plinths.forEach(p => p.update(t)); rep.update(t); track.scale.x = Math.max(1e-3, ease(prog(t, 2.2, 3.0))); },
      };
    });
}

const fade = document.getElementById('fade');
let TOTAL = 0;

// seek(T): draw the whole video at time T in seconds.
const seek = async function (T) {
  const s = SCENES.find(x => T < x.t1) || SCENES[SCENES.length - 1];
  const t = T - s.t0;
  for (const x of SCENES) { const on = x === s; x.group.visible = on; x.el.style.display = on ? 'block' : 'none'; x.refEl.style.display = on && x.refEl.textContent ? 'block' : 'none'; }
  s.update(t);
  // Camera: an eased dolly through the scene's keys.
  const look = path(s.cam.map(([k, , l]) => [k, l]), t).clone();
  // zoom pulls the camera back along its own line of sight, so a scene keeps its angle.
  const pos = path(s.cam.map(([k, p]) => [k, p]), t).clone().sub(look).multiplyScalar(s.zoom || 1).add(look);
  camera.position.copy(pos); camera.lookAt(look); camera.updateMatrixWorld();
  // Focus on the hero: its depth along the view axis, so the rest falls off softly.
  const hero = s.hero(t), fwd = camera.getWorldDirection(new THREE.Vector3());
  bokeh.uniforms.focus.value = hero.clone().sub(camera.position).dot(fwd);
  // Text: each element fades and lifts in at its own time.
  for (const el of s.el.querySelectorAll('[data-t]')) {
    const u = ease(prog(t, +el.dataset.t, +el.dataset.t + 0.5));
    el.style.opacity = u; el.style.transform = `translateY(${(1 - u) * 14}px)`;
  }
  s.refEl.style.opacity = ease(prog(t, 1.0, 1.6));
  // A short dip to the background colour at each cut, and in and out at the ends.
  let f = Math.max(1 - T / 0.6, (T - (TOTAL - 0.9)) / 0.9, 0);
  for (const x of SCENES.slice(1)) f = Math.max(f, 1 - Math.abs(T - x.t0) / 0.32);
  fade.style.opacity = clamp(f);
  composer.render();
};

await document.fonts.load('600 64px Fredoka');
await document.fonts.load('500 64px Fredoka');
await document.fonts.load('700 30px Nunito');
build();
TOTAL = SCENES[SCENES.length - 1].t1;
window.TOTAL = TOTAL;
// Published only now, because render.mjs starts as soon as seek exists.
window.seek = seek;

const q = new URLSearchParams(location.search);
const fit = () => { if (q.has('play') || q.has('fit')) stage.style.transform = `scale(${Math.min(innerWidth / W, innerHeight / H)})`; };
fit(); addEventListener('resize', fit);
if (q.has('play')) {
  const t0 = performance.now();
  const tick = () => { seek(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(tick); };
  tick();
} else seek(+q.get('t') || 0);
</script>
