# =============== REAL UR5e ROBOT =====================
robot:
  host: "127.0.0.1"
  gripper: { power_pin: 1, control_pin: 2 }
  motion: { default_speed: 0.25, default_acc: 0.5 }   # m/s, m/s^2 (moveL)


# ================== PATHS ===================
# Split by whether a script can rebuild it:
#   raw/       captures that cannot be regenerated. Nothing writes here except
#              the recorder. Back this up.
#   cache/     depth maps, rendered frames, detector JSON. Delete freely.
#   processed/ the dataset you train on, rebuilt from raw/ by export_lerobot.py
#   reports/   pictures for looking at. Not data, not inputs to anything.
#   config/calibration/  git-tracked, because you must know which calibration
#                        produced which result
paths:
  episodes_dir: "data/raw/episodes/"
  cache_dir: "data/cache/"
  processed_dir: "data/processed/"
  figures_dir: "reports/figures/"
  logs_dir: "logs/"
  calibration_dir: "config/calibration/"

# ================== WORKSPACE SAFETY ==================
# Base-frame axis-aligned box that every commanded pose is checked against
# BEFORE it reaches the controller. Numbers below are placeholders: measure the
# real cell and replace them before the arm is ever driven from a plan.
# A plan that reaches the controller unchecked is how an arm hits the table.
workspace:
  x: [-0.700, 0.700]      # metres, robot base frame
  y: [-0.700, 0.700]
  z: [ 0.005, 0.700]      # z min is just above the table surface
  max_speed: 0.25         # m/s  ceiling applied to every skill
  max_acc: 0.50           # m/s^2

# ================== CAMERA ==================
# Fixed RGB-D looking at the table. Intrinsics come from the SDK at runtime,
# never hardcoded, because they change with resolution.
camera:
  width: 1280
  height: 720
  fps: 30
  align_depth_to_color: true
  max_depth: 2.0          # metres, readings beyond this are treated as invalid
  depth_patch_radius: 2   # median over a (2r+1)^2 patch, robust to speckle

# ================== SPEECH ==================
# ASR sits OUTSIDE both architectures and is identical for both: one microphone,
# one model, one transcript, handed to A and to B unchanged. Cleaning the
# transcript for one and not the other makes speech a confound and the
# comparison stops meaning anything.
speech:
  model: "large-v3"        # VRAM is not the constraint here, ~3.4 GB at float16
  device: "cuda"           # "cpu" to test without a GPU; compute_type follows
  compute_type: "float16"  # NOT int8. CTranslate2 int8 crashes on sm_120
  language: "en"           # null auto-detects, at the cost of an extra pass
  beam_size: 5
  samplerate: 16000        # Whisper's native rate, so nothing gets resampled
  min_duration_s: 0.3      # below this it was a stray keypress, not an utterance
  max_duration_s: 30.0     # truncate rather than hand Whisper a forgotten stream
  log_dir: "logs/speech/"  # one wav + one jsonl line per utterance, timestamped
  save_audio: true         # audio alongside the transcript, per W2b

# ================== ARCHITECTURE A ==================
architecture_a:
  detector:
    model: "google/owlv2-base-patch16-ensemble"
    threshold: 0.3
    nms_iou: 0.5
  grounding:
    # Turns the instruction into detector queries. Same model as the planner by
    # default: this is the planner reasoning about what to look for, not a new
    # component, so it should not quietly become a different one.
    model: null            # null means "use the planner model"
    max_queries: 8         # more queries slows OWLv2 and adds false positives
    max_tokens: 512
  planner:
    model: "claude-sonnet-4-5"
    max_tokens: 2048
    max_turns: 6          # planner/tool exchanges before the run is abandoned
  skills:
    approach_height: 0.12   # metres above the target before descending
    retreat_height: 0.15
    grasp_depth_offset: 0.0 # + lowers the grasp point, tune per gripper
    speed: 0.10             # m/s during descent and transport
    acc: 0.30
    settle_s: 0.4           # pause after gripper actuation
    # Tool orientation as a UR rotation vector, base frame. This is the
    # "gripper pointing straight down" pose and must be measured on the real
    # cell by hand-guiding the arm and reading get_state()["tcp_pose"][3:].
    down_rotvec: [3.142, 0.0, 0.0]
  trace:
    dir: "logs/traces/"
