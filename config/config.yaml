# Every tunable value in the project. Reasoning lives in docs/adr/,
# not here. Bench measurement procedure is in docs/commands.md, "At the bench".
#
# MEASURE BEFORE DRIVING THE ARM: robot.host, robot.gripper.*, workspace.x/y/z,
# architecture_a.skills.down_rotvec, and robot.home_q which is absent.

robot:
  host: "10.149.230.1"       # NEW IP ADDRESS CONFIRMED
  rtde_port: 30004
  gripper:                # OnRobot RG2 on the tool connector, no Compute Box. URScript over the tool pins
    open_mm: 100.0        # RG2 stroke is 0 to 110 mm; 100 keeps clear of the end stop
    close_mm: 0.0
    force_n: 20.0         # 3 to 40 N. Half of the maximum holds a cup without crushing it
    tolerance_mm: 5.0     # a width this close to the target counts as "already there"
    max_sends: 2          # the command is sent again once if the fingers do not start to move
    result_register: 12   # output int 12 and 13 and output double 12. ur_rtde leaves 12 to 19 to the user
    result_timeout_s: 0.5 # wait for the result to reach RTDE after the script ends
  home_q: [-0.6730, -1.5575, -1.5866, -1.5507, 1.5844, 4.3802]  # rad. RTDE 1 Oct 2026: [-38.56, -89.24, -90.90, -88.85, 90.78, 250.97] deg, TCP down at (0.306, -0.406, 0.302). Base on the negative side, so it has room to turn both ways
  motion:
    default_speed: 0.25   # m/s, m/s^2, for blocking moveL and moveJ
    default_acc: 0.50
  servo:                  # non-blocking servoL path, used by Architecture B
    time: 0.05            # s, one control period. MUST match the policy rate
    lookahead_time: 0.1   # s, 0.03 to 0.2. Higher smooths and adds lag
    gain: 300             # 100 to 2000. Higher chases harder and can oscillate

workspace:                # base frame, not world. Every commanded pose is checked
  x: [ 0.150, 0.823]      # RTDE 1 Oct 2026, bounding box of the 4 table corners. Table is ~41 deg to the base axes, so half this box is OFF the table
  y: [-0.724, 0.030]      # corners (0.756,0.030) (0.824,-0.139) (0.415,-0.725) (0.149,-0.499). max_radius cuts the far arc
  z: [ 0.177, 0.380]      # table 0.172 in base frame (fingertips ~1 mm above it, 23 Sep 2026) + 5 mm. Max 0.38 from 13 Oct 2026, paired with max_radius 0.70, see below
  max_radius: 0.70        # m, horizontal distance from the base axis. 0.81 was out of reach on 23 Sep 2026. 13 Oct 2026: reach limit MEASURED 0.769 at TCP z 0.32 (elbow -28.4 deg, tool down) and it shrinks with height (~0.71 at 0.40), so 0.75 had no margin above z 0.35 and the 0.42 calibration pose protective-stopped. 0.70 with z max 0.38 keeps >= 2 cm of reach margin everywhere
  max_joint_step_deg: 30  # a joint move turning any joint more than this is refused. Stops a full wrist spin
  max_speed: 0.25         # m/s ceiling. Architecture B derives its per-step limit from this
  max_acc: 0.50           # m/s^2
  max_angular_speed: 1.0  # rad/s. B needs this stated because it commands steps, not paths

paths:                    # split by whether a script can rebuild it
  episodes_dir: "data/raw/episodes/"      # cannot be regenerated. Back this up
  cache_dir: "data/cache/"                # delete freely
  processed_dir: "data/processed/"        # rebuilt from raw/
  figures_dir: "reports/figures/"
  logs_dir: "logs/"
  calibration_dir: "config/calibration/"  # git-tracked, so results stay attributable

camera:
  width: 1280                 # colour. What OWLv2, SAM and Architecture B see
  height: 720
  depth_width: 848            # 13 Oct 2026: Intel's recommended D435 depth resolution. Aligned onto the colour
  depth_height: 480           # image, so depth still arrives at 1280x720 on colour pixels and nothing downstream changes
  fps: 30
  align_depth_to_color: true  # not optional. Without it every object lands centimetres off
  max_depth: 2.0              # m, readings beyond this are invalid
  depth_patch_radius: 2       # median over a (2r+1)^2 patch, robust to speckle
  visual_preset: "Default"    # SET on every start, because the camera keeps whatever the last program left. 13 Oct 2026: a leftover "High Accuracy" emptied a white box top and half the table
  laser_power_mw: 250         # IR projector; factory default 150, D435 max 360. 13 Oct 2026: raised for more dot texture on
                              # smooth objects. Earlier "High Accuracy" + 360 mW gave no gain on the orange and lost flat white
                              # surfaces, so if the white box top goes patchy in check_camera, step back towards 150

speech:                   # ASR is a CONTROLLED VARIABLE, identical for both architectures
  model: "large-v3"
  device: "cuda"          # "cpu" works everywhere and is far slower
  compute_type: "float16" # NOT int8, which crashes on sm_120
  language: "en"
  beam_size: 5
  samplerate: 16000       # Whisper's native rate, so nothing gets resampled
  min_duration_s: 0.3     # below this it was a stray keypress
  max_duration_s: 30.0
  log_dir: "logs/speech/"
  save_audio: true

architecture_a:
  detector:
    model: "google/owlv2-base-patch16-ensemble"
    threshold: 0.3
    nms_iou: 0.5
  segmenter:
    model: "facebook/sam-vit-base"   # SAM, prompted by each OWLv2 box; used only when perception.localiser is mask_ray
  perception:
    # How a detection becomes a 3D point (13 Oct 2026). mask_ray: SAM mask, then the ray through
    # its centre cut at table_z + height/2; depth only gives the height. box_depth: the original
    # box-centre depth plus centre push, which put far picks about a radius BEHIND the orange.
    localiser: "mask_ray"
    height_from: "depth"           # mask_ray centre height. depth: middle of the object's own lowest/highest points (any object,
                                   # drawer handles too). mask_size: table + half its pixel size, no object depth at all,
                                   # only for compact things resting on the table. Compare both with place_and_look --dry-run
    mask_erode_px: 3               # mask outline dropped before reading depth; that is where the table blends in
    height_percentile: 95.0        # object top = this percentile of its points' base z, bottom = 100 minus it
    resting_gap_mm: 25.0           # depth: lowest points this close to the table = resting on it (centre = half its top);
                                   # further up (a drawer handle) the centre is the middle of its own points
    min_mask_points: 30            # fewer valid depth points than this and the height comes from pixel size instead
    min_object_height_mm: 10.0     # clamp on the estimated height; 10 keeps the centre at workspace.z min (table 0.172 + 5)
    max_object_height_mm: 300.0
    depth_frames: 5                # A's depth = per-pixel median over this many frames, arm at rest (~0.17 s at 30 fps). Noise only, not bias
    duplicate_separation_mm: 20.0  # closer than this is one object seen twice
    max_centre_offset_mm: 40.0     # box_depth only. most a point is pushed from the seen face to the centre. A 65 mm orange needs ~33
    max_below_floor_mm: 40.0       # an object centre this far under workspace.z min is lifted to it (centre push through an open box's floor); further is a bad reading
  grounding:
    model: null           # null means use the planner model, so no new component enters A
    max_queries: 8        # more queries slow OWLv2 and add false positives
    max_tokens: 512
  planner:
    model: "claude-sonnet-5-5"  # 1 Oct 2026. sonnet-4-5 deprecated 30 Sep 2026 and 404s for this key
    max_tokens: 2048
    max_turns: 6          # planner/tool exchanges before the run is abandoned
  skills:
    approach_height: 0.12 # m above the target before descending
    retreat_height: 0.15
    grasp_depth_offset: 0.028  # + lowers the grasp point. 1 Oct: 0.020 lifted the orange and dropped it (held above its middle). 0.028 is the most the z floor allows when the centre reads 0.205. Was 0.025 to reach a SURFACE point; the localiser now gives the centre (1 Oct 2026), which is ~15 mm lower already. RG2 pads sit above the TCP tip
    speed: 0.10           # m/s during descent and transport
    acc: 0.30
    down_rotvec: [0.580, 3.087, 0.0]  # RG URCap TCP, vertical, home yaw. RTDE 23 Sep 2026. Roll flips here, see check_orientation.py
    min_grasp_width_mm: 5.0  # a close ending below this held nothing. RG2 closes to about 0 on air. Keep it below the thinnest object or handle
  trace:
    dir: "logs/traces/"
  calibration:            # scripts/calibrate_ball.py, the per-session fit of T_base_cam. A ball in the gripper, no markers
    ball_query: "orange"  # OWLv2 noun phrase. Name the colour if the ball is plain, e.g. "orange ball"
    ball_radius_m: 0.03425  # MEASURE the ball once. 0.020 is a 40 mm table tennis ball. 13 Oct 2026: orange, 54 mm tall x 83 mm wide, so (h+w)/4 because it is not round
    ball_offset_tool_m: [0.0, 0.0, -0.027]  # 13 Oct 2026: orange held stem up, so minus HALF THE HEIGHT, not the radius. ball centre in the TOOL frame from the TCP. Tool z points out of the flange, so negative is back towards it. -radius = ball bottom flush with the fingertips (the TCP is at the tips). A wrong value shifts the whole fit and the residual CANNOT see it
    grid_centre_xy: [0.52, -0.30]  # 13 Oct 2026 (2nd): widened to the whole reachable table, see grid_half_extent_m. 13 Oct 2026: moved to cover the object area in front of the camera (an orange at (0.39,-0.44) read 34 mm low outside the old grid). Was [0.536, -0.333], the mean of the 4 table corners. Far corner (0.57,-0.52) is past max_radius 0.70 and is dropped
    grid_half_extent_m: 0.20  # 13 Oct 2026: was 0.12. Picks were missing objects OUTSIDE the old 24 cm patch (extrapolation); 0.20 with n=5 gives 34 poses, x 0.32-0.62, y -0.50 to -0.10, all in frame
    grid_n: 5             # n x n positions per height. 4 from 13 Oct 2026 (was 3): 26 usable poses instead of 16, about 2.5 min
    z_levels: [0.19, 0.30]  # 13 Oct 2026: 0.19 so ball centres reach down to object height (~0.2) instead of extrapolating 5 cm below the grid; orange bottom ~18 mm above the table. Was [0.22, 0.30]. TCP heights. At least two, or the points are coplanar and the fit is refused. 13 Oct 2026: 0.42 hit a protective stop; JJ's rule, never above the home TCP z (0.302). 0.22 keeps the ball bottom ~5 cm above the table (0.172)
    speed: 0.10           # m/s, slow because the ball is held only by friction
    settle_s: 0.5         # wait after each move so the frame is not blurred
    min_points: 8         # fewer usable points than this and nothing is written
    max_rms_mm: 8.0       # a fit worse than this is written only if you confirm it
    # scripts/level_to_table.py, run AFTER the ball fit (13 Oct 2026). The table is the one surface
    # whose base-frame height is known, so it corrects the fit's height and tilt
    table_z: 0.172        # table surface, base frame. Fingertips touched it on 23 Sep 2026 (workspace.z min is this + 5 mm)
    level_frames: 15      # depth frames combined per pixel (median), so single-frame jitter (24 mm seen at 1.24 m) averages out
    level_band_m: 0.08    # only points within this of table_z under the CURRENT transform are considered table
    level_max_tilt_deg: 5.0    # a larger correction means something else is wrong; refused without --force
    level_max_shift_mm: 60.0
    place_look_n: 4       # scripts/place_and_look.py: n x n table spots over 3/4 of the grid, those inside reach. 4 gives 11 spots, about 4 min

architecture_b:
  camera: "top"           # MUST match the --camera used at export
  gripper_threshold: 0.5  # policy outputs a float, the dataset stores 0 or 1
  # No per-step limits here. They are DERIVED in policy_action.py as
  # workspace.max_speed * robot.servo.time, so B can never outrun A.

testing:                  # only tests/hardware/ needs these. They move a real arm
  step_m: 0.02            # how far a positional test moves the TCP
  step_rad: 0.05          # how far a joint test moves one joint
  tolerance_m: 0.003
  tolerance_rad: 0.01
  settle_s: 0.5
  stopped_tolerance_m: 0.001  # movement below this counts as "the arm is still"
  gripper_cycles: 20      # close and open pairs in the gripper endurance test. ~1 in 66 was lost before the resend
  gripper_no_op_s: 0.6    # a gripper call that sends nothing should return within this. Fixed cost was ~0.2 s
  rotate_deg: 10          # tool rotation in the down-pose tests, the case Koji reported
  rotate_max_joint_deg: 45  # any joint turning more than this took the long way (a long turn is ~350)
  rotate_joint_tolerance_deg: 3  # wrist 3 must turn rotate_deg within this for a tool z rotation
  down_tolerance_deg: 15  # the down-pose tests skip unless the TCP is this close to down_rotvec
