[project]
name = "llm_based_interface_for_robotics_systems_using_ur5e"
version = "0.1.0"
description = "Modular vs. end-to-end vision-language-action models for embodied robotic manipulation, on a UR5e"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "faster-whisper>=1.1.0",
    # CTranslate2 4.5+ dlopens these by bare name and this venv has no torch to
    # supply them, so faster-whisper loads the model happily and then fails on
    # the first encode with "Library libcublas.so.12 is not found". About 1.5 GB.
    # `shared/speech.py` preloads them by absolute path, so no LD_LIBRARY_PATH.
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pyrealsense2>=2.55.0",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.1",
    "ur-rtde>=1.6.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fyp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the real UR5e reachable at robot.host; MOVES THE ARM"]

[tool.pyright]
reportAttributeAccessIssue = false