[project]
# The distribution name MUST start with "lerobot_robot_". LeRobot's
# `register_third_party_plugins` walks installed distributions and imports the
# ones carrying that prefix, which is how `--robot.type=ur5e` becomes a valid
# choice without forking LeRobot.
name = "lerobot_robot_ur5e"
version = "0.1.0"
description = "LeRobot Robot adapter for a UR5e with a fixed RealSense, for Architecture B"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyrealsense2>=2.55.0",
    "ur-rtde>=1.6.3",
]

# `lerobot` is deliberately NOT a dependency. This package is installed INTO the
# lerobot environment, which already has it, and declaring it here would let uv
# resolve a second copy over the editable clone at ~/lerobot.
#
# `fyp` is deliberately NOT a dependency either. It is reached over PYTHONPATH,
# the same way scripts/hdf5_to_lerobot.py already reaches it, so the FYP repo
# stays the single source of the controller and camera code.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_ur5e"]
